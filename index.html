<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoodBridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍲 FoodBridge</h1>
<p class="tagline">Connecting surplus food to people in need.</p>

<div class="tabs">
  <button id="donorTab">Restaurant / Donor</button>
  <button id="receiverTab">NGO / Receiver</button>
</div>

<!-- DONOR SECTION -->
<div id="donorSection" class="card">
  <h2>Submit Surplus Food</h2>

  <input id="donorName" placeholder="Restaurant / Person Name">
  <input id="foodName" placeholder="Food Name">
  <input id="quantity" type="number" placeholder="People Count">
  <input id="location" placeholder="Location">
  <input id="phone" placeholder="Phone Number">

  <button id="donateBtn">Submit Donation</button>

  <p id="quote"></p>
</div>

<!-- RECEIVER SECTION -->
<div id="receiverSection" class="card hidden">
  <h2>Available or Accepted Donations</h2>

  <table>
    <thead>
      <tr>
        <th>Donor</th>
        <th>Food</th>
        <th>Qty</th>
        <th>Location</th>
        <th>Contact</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="foodList"></tbody>
  </table>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
